services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university-catalog-mcp-server
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/catalog.db
      - HOST=0.0.0.0
      - PORT=8080
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
